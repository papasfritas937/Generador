<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Enlaces Monetizados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h2 { margin-bottom: 20px; text-align: center; color: #ff3333; }
    label { font-size: 14px; margin-bottom: 5px; display: block; color: #bbb; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    input:focus { border-color: #0088cc; outline: none; }
    button {
      width: 100%;
      padding: 12px;
      background: #0088cc;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #006699; }
    #resultBox {
      margin-top: 20px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 6px;
      display: none;
      word-break: break-all;
    }
    .link-output { color: #00ff88; font-weight: bold; font-size: 14px; margin-bottom: 10px; display: block; }
    .copy-btn { background: #ff0000; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Generador de Link de Vídeo</h2>
    
    <label>Link del Vídeo (Videy, Streamtape, etc.):</label>
    <input type="text" id="videoUrl" placeholder="https://videy.co/v?id=...">

    <label>Link del Anuncio / Acortador:</label>
    <input type="text" id="adUrl" placeholder="https://tu-anuncio.com">

    <button onclick="generarLink()">Generar Enlace Monetizado</button>

    <div id="resultBox">
      <label>Tu Enlace Final Listo:</label>
      <span id="finalLink" class="link-output"></span>
      <button class="copy-btn" onclick="copiarLink()">Copiar Enlace</button>
    </div>
  </div>

  <script>
    function generarLink() {
      const vid = encodeURIComponent(document.getElementById('videoUrl').value.trim());
      const ad = encodeURIComponent(document.getElementById('adUrl').value.trim());

      if (!vid || !ad) {
        alert("Por favor ingresa el enlace del vídeo y del anuncio.");
        return;
      }

      // Obtiene la dirección donde está alojado player.html en tu GitHub
      const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'player.html';
      const linkFinal = `${baseUrl}?vid=${vid}&ad=${ad}`;

      document.getElementById('finalLink').innerText = linkFinal;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copiarLink() {
      const texto = document.getElementById('finalLink').innerText;
      navigator.clipboard.writeText(texto);
      alert("¡Enlace copiado al portapapeles!");
    }
  </script>

</body>
</html>
